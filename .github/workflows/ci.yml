name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
