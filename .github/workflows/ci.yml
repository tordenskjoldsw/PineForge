name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --target thumbv7em-none-eabihf
          --component clippy,rustfmt
      # The linker for the firmware target; see `.cargo/config.toml`. Without it
      # every link of the binary fails, so it is installed before anything that
      # builds - `cargo check` gets away without it, `cargo clippy` does not.
      - name: Install flip-link
        run: cargo install flip-link --version 0.1.12 --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Cheap and first: a layer violation is a design regression, and finding
      # it before a six-minute release build is the point.
      - name: Check layer boundaries
        run: ./scripts/check-layers.sh
      - name: Check production firmware
        run: cargo check --release
      - name: Check diagnostics firmware
        run: cargo check --release --features diagnostics
      - name: Lint production firmware
        run: cargo clippy --release -- -D warnings
      - name: Lint diagnostics firmware
        run: cargo clippy --release --features diagnostics -- -D warnings
      - name: Test production state machine
        run: >-
          cargo test --locked --manifest-path crates/pineforge-state/Cargo.toml
          --target x86_64-unknown-linux-gnu
      - name: Test diagnostics state machine
        run: >-
          cargo test --locked --manifest-path crates/pineforge-state/Cargo.toml
          --target x86_64-unknown-linux-gnu
          --features diagnostics
      # The screens are checked on the host because nothing about drawing one
      # needs a watch: a Canvas borrows any Surface, and the tests give it a
      # recording one. Without ui-animations, so the crate stays clear of
      # Embassy - the transition's stripe timing is the only thing that wants a
      # clock.
      - name: Test screens
        run: >-
          cargo test --locked --manifest-path crates/pineforge-ui/Cargo.toml
          --target x86_64-unknown-linux-gnu
      # The runners, driven with a table of register answers for a bus and the
      # test's own channels for the IPC. This is what the crate split is for:
      # while these lived in the firmware binary, `cargo test` could not reach
      # them at all - a `no_main` crate that pulls in `embassy-nrf` does not
      # build for a host. Without the `defmt` feature, which needs a logger a
      # test binary has no business linking.
      - name: Test runners
        run: >-
          cargo test --locked --manifest-path crates/pineforge-services/Cargo.toml
          --target x86_64-unknown-linux-gnu
      - name: Test runners with diagnostics
        run: >-
          cargo test --locked --manifest-path crates/pineforge-services/Cargo.toml
          --target x86_64-unknown-linux-gnu
          --features diagnostics
      - name: Check screens build for the watch
        run: >-
          cargo check --locked --manifest-path crates/pineforge-ui/Cargo.toml
          --release --features ui-animations,diagnostics

  size:
    name: Size budget (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            features: ""
            # 432 KiB, against a 475,104-byte slot. A design target rather than
            # the slot limit, so unnoticed growth still fails a build - but the
            # v0.2 target of 360 KiB was leaving 104 KiB of the slot unused and
            # had started shaping features rather than catching bloat.
            #
            # Held to a looser margin than the RAM budget on purpose: the two
            # fail in opposite ways. A static that outgrows RAM overwrites the
            # stack silently, on hardware, later. An image that outgrows this is
            # refused by imgtool at packaging time, so the worst case is a build
            # that does not produce a ZIP. Two thirds of what is used is the BLE
            # stack. TIME, DATE and their power-loss-tolerant clock journal
            # raised the 420 KiB target to 432 KiB; extracting the runners into
            # `pineforge-services` raised it again, by 3,680 bytes of inlining
            # the crate boundary gives up. That price was known and accepted:
            # what it buys is a runner `cargo test` can drive, which is the
            # difference between a sensor's lifecycle being readable and it
            # being checked.
            #
            # 448 KiB leaves 16,352 bytes before the physical image ceiling -
            # the reserve the diagnostics target used to hold, now held by the
            # build that ships.
            #
            # How much room is left over the image itself is deliberately not
            # written here: it was, and it was stale within a few releases, which
            # is the opposite of what a budget comment is for. The step below
            # prints it on every run, and that is the number to read before
            # raising this one.
            flash: 458752
            # A stack reserve, expressed as the statics that fit around it.
            #
            # `flip-link` puts the stack below the statics, so the 65,528-byte
            # RAM region is shared and every byte here is a byte the stack does
            # not get. The deepest path the firmware has is a BLE key exchange:
            # the controller runs the elliptic-curve arithmetic in a
            # high-priority interrupt, nested on top of whatever the thread was
            # doing.
            #
            # Measured on hardware, that peak is **16,900 bytes** - taken from a
            # diagnostics build after the phone was made to forget the device,
            # which is the part that makes it a pairing rather than a
            # reconnection. The bond lives in external flash and survives a DFU,
            # so a build that is merely flashed and reconnected to never runs the
            # exchange, and an earlier reading of 13,000 taken that way set this
            # budget 456 bytes too loose and broke pairing.
            #
            # The reserve is 18 KiB, so even at the ceiling below there are 1,532
            # bytes over that peak - 9 %. The shipping image sits further back
            # again, at 19,336 bytes of stack. The margin is not decoration:
            # 16,900 is one reading, and DFU, a notification arriving mid-pairing
            # and the alarm path are all outside it.
            #
            # Two regressions reached hardware through this number before it was
            # derived rather than chosen, and both looked like a watch that
            # reboots whenever it is asked to pair. Raising it means measuring
            # again, the way described in `src/boot/stack.rs`.
            ram: 47096
          - name: diagnostics
            features: diagnostics
            # Diagnostics may grow closer to the slot than the shipping build,
            # and retains 8 KiB of it - the same two-tier shape the RAM reserve
            # below has, and for the same reason: an instrumented image is
            # flashed over a cable by someone watching it.
            flash: 466944
            # The same ceiling as production, not a looser one: diagnostics
            # pairs over the same radio with the same elliptic curve underneath,
            # and an instrumented image that cannot pair cannot be used to
            # diagnose pairing. It is also the build the 13,000-byte reading came
            # from, so holding it to the same reserve keeps the measurement and
            # the thing measured in step.
            ram: 47096
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --target thumbv7em-none-eabihf
          --component llvm-tools
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --version 0.4.0 --locked
      # `cargo size` links the binary, so this job needs the linker too.
      - name: Install flip-link
        run: cargo install flip-link --version 0.1.12 --locked
      - name: Enforce size budget
        run: >-
          ./scripts/check-size.sh
          "${{ matrix.features }}"
          "${{ matrix.flash }}"
          "${{ matrix.ram }}"
