[package]
name = "pineforge-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
diagnostics = ["dep:microfft"]

[dependencies]
heapless = "0.9.3"
microfft = { version = "0.6.0", default-features = false, features = ["size-64"], optional = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
