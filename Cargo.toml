[package]
name = "pineforge"
version = "1.0.0"
edition = "2024"
# The one toolchain this project is built and tested with, and the same one
# `rust-toolchain.toml` pins. A lower bound here would be a compatibility claim
# nothing checks; for firmware, one reproducible toolchain is worth more than an
# untested range.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "PineForge: a modern, modular Rust firmware for the PINE64 PineTime"
publish = false

[workspace]
members = ["crates/pineforge-services", "crates/pineforge-state", "crates/pineforge-ui"]
resolver = "3"

[features]
default = ["ble", "ui-animations"]
ble = ["dep:bt-hci", "dep:nrf-mpsl", "dep:nrf-sdc", "dep:trouble-host", "dep:postcard", "dep:serde"]
diagnostics = ["pineforge-services/diagnostics", "pineforge-state/diagnostics", "pineforge-ui/diagnostics"]
# Kept as a feature so memory experiments can disable the 5.6 KiB transition
# scratch, but normal production firmware includes the intended animations.
ui-animations = ["pineforge-ui/ui-animations"]

[[bin]]
name = "pineforge"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52832", "gpiote", "time", "time-driver-rtc1", "defmt", "nfc-pins-as-gpio", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
mipidsi = "0.10.0"
nrf-pac = { version = "0.4.0", features = ["nrf52832"] }
# The released nrf-sdc 0.3.0 still targets embassy-nrf 0.7. This revision is
# the embassy-nrf 0.11 line that the TrouBLE examples pin and test against.
bt-hci = { version = "0.9", features = ["defmt"], optional = true }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = ["nrf52832", "critical-section-impl", "defmt"], optional = true }
# peripheral+central selects Nordic's multirole blob; the peripheral-only
# blob lacks HCI symbols that nrf-sdc's controller impl references.
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = ["nrf52832", "peripheral", "central", "defmt"], optional = true }
# trouble-host only defines its GAP attribute count for security+central, so
# central is required even though this firmware acts purely as a peripheral.
trouble-host = { version = "0.7.0", default-features = false, features = ["peripheral", "central", "gatt", "derive", "default-packet-pool", "security", "serde", "defmt"], optional = true }
# Serializes BLE bond keys for persistence across reboots.
postcard = { version = "1.1", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
pineforge-services = { path = "crates/pineforge-services", features = ["defmt"] }
pineforge-state = { path = "crates/pineforge-state" }
pineforge-ui = { path = "crates/pineforge-ui" }
static_cell = "2.1.1"

[profile.dev]
codegen-units = 1
debug = 2
incremental = false
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
# Fat LTO cannot ingest the prebuilt Nordic SoftDevice-Controller objects;
# thin LTO links them cleanly at a small size cost.
lto = "thin"
opt-level = "s"
strip = false

# The render path, and only the render path, is optimised for speed.
#
# A boot-time benchmark settled where a paint's time goes: the bus carries a
# frame in 121 ms against a 115.2 ms floor, so the wire has nothing left to
# give, and everything above it is the core turning pixels into bytes. Size is
# still the right default for a firmware two thirds of which is a BLE stack that
# spends its life waiting, but these four crates are where the loops are.
#
# Whole-image `opt-level = 3` was measured first and was not affordable: 465,940
# bytes against the then-current 430,080-byte budget. Confined to these four it
# cost 5,960 bytes and no RAM at all, leaving 35,984 bytes of headroom at the
# time of that measurement.
[profile.release.package.pineforge-ui]
opt-level = 3
[profile.release.package.embedded-graphics]
opt-level = 3
[profile.release.package.mipidsi]
opt-level = 3
[profile.release.package.embassy-nrf]
opt-level = 3

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
