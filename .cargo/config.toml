[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52832_xxAA"
# Puts the stack below the statics instead of above them. On the default layout
# the stack grows down into .bss, so an overflow silently overwrites a suspended
# task's state and the watch misbehaves later, somewhere else. Flipped, the
# stack grows down out of RAM into unmapped addresses and faults immediately, at
# the point of overflow. It is a link-time rearrangement and costs nothing at
# runtime.
linker = "flip-link"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
# The RTT ring, which defaults to 1 KiB of static RAM.
#
# That KiB buys nothing on the watch this firmware is built for. A sealed
# PineTime has no exposed SWD pads, so nothing can ever attach to read the
# channel - and every byte of static RAM comes out of the stack, because
# `flip-link` puts the stack underneath. It came out of exactly the wrong
# place: pairing's elliptic-curve arithmetic is the deepest path the firmware
# has, and 704 bytes of static growth was enough to push it off the end and
# turn every pairing attempt into a watchdog reset.
#
# 128 bytes still carries a defmt frame for anyone working on an opened watch
# with a debugger attached, which is the only situation the buffer is readable
# in at all.
DEFMT_RTT_BUFFER_SIZE = "128"
# BLE DFU throughput. During a firmware transfer the phone streams a window of
# write-without-response packets (bounded by the Nordic DFU packet-receipt
# interval) while the GATT task is briefly busy staging a page to external
# flash - a sector erase blocks it for tens of milliseconds. trouble-host's
# defaults (connection event queue 2, packet pool 16) are far too small to
# hold one such window: the host runner blocks trying to enqueue incoming
# writes, which also stalls the outgoing packet-receipt notification, so the
# phone waits forever for a receipt and the transfer deadlocks near the end.
# Size the queues and shared pool to comfortably cover a receipt window plus
# headroom for the outgoing notification. A 24-packet pool failed an OTA
# hardware test; 32 is the smallest currently validated shared-pool baseline.
TROUBLE_HOST_CONNECTION_EVENT_QUEUE_SIZE = "16"
TROUBLE_HOST_L2CAP_RX_QUEUE_SIZE = "16"
TROUBLE_HOST_DEFAULT_PACKET_POOL_SIZE = "32"
